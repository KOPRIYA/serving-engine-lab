name: CPU correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check serving_engine scripts tests
      - run: python scripts/audit_public.py
      - name: Verify reviewed reference evidence
        run: |
          python -m serving_engine.verify results/apple-m5-reference/raw.json
          python -m serving_engine.verify results/cpu-reference/raw.json
      - run: bash -n scripts/validate.sh scripts/benchmark.sh scripts/serve.sh
      - name: Tests and CPU benchmark consistency
        run: python scripts/workflow.py benchmark --backend numpy --rounds 1 --short 16 --long 64 --output-tokens 4
      - run: python -m build
